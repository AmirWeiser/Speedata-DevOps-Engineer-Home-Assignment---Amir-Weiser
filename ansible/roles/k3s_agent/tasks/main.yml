---
- name: Check that the server play provided the join token
  ansible.builtin.assert:
    that: hostvars[groups['k3s_server'][0]].k3s_server_token is defined
    fail_msg: "No join token: run the whole playbook (site.yml), not only the agents."
    quiet: true

- name: Create the K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write the K3s agent configuration (contains the join token)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  diff: false # never print the token
  notify: Restart k3s-agent

- name: Read the installed K3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_agent_installed
  changed_when: false
  failed_when: false

# K3s refuses a node whose name is already registered with a different node password
# (kube-system/<name>.node-password.k3s). A machine without K3s that reuses a node name is
# a replacement, so its old registration is removed first. Never runs on a working node.
- name: Remove the stale registration of a replaced worker
  when: k3s_agent_installed.rc != 0
  ansible.builtin.command: "k3s kubectl delete --ignore-not-found {{ item }}"
  loop:
    - "node {{ inventory_hostname }}"
    - "-n kube-system secret {{ inventory_hostname }}.node-password.k3s"
  delegate_to: "{{ groups['k3s_server'][0] }}"
  register: k3s_agent_stale_cleanup
  changed_when: "'deleted' in k3s_agent_stale_cleanup.stdout"

- name: Install K3s agent {{ k3s_version }}
  when: k3s_version not in (k3s_agent_installed.stdout | default(''))
  block:
    - name: Download the K3s installer for {{ k3s_version }}
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version | urlencode }}/install.sh"
        dest: /usr/local/bin/k3s-install.sh
        mode: "0755"

    - name: Run the K3s installer (verifies the binary checksum)
      ansible.builtin.command: /usr/local/bin/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: agent
      # GitHub release downloads intermittently return 504; the script only installs
      # after the checksum verifies, so a failed attempt is safe to repeat.
      register: k3s_agent_install
      retries: 5
      delay: 30
      until: k3s_agent_install.rc == 0
      changed_when: true

- name: Apply pending configuration changes
  ansible.builtin.meta: flush_handlers

- name: Ensure the K3s agent is running and enabled
  ansible.builtin.systemd_service:
    name: k3s-agent
    state: started
    enabled: true
