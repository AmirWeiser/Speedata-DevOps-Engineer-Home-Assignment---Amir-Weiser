---
# K3s cluster + GitOps bootstrap. Idempotent: a second run reports no changes.
# Inventory is generated by Terraform (infra/aws). Always run the whole playbook:
# the agents need the join token that the server play reads.

- name: Wait until every node is reachable and cloud-init has finished
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init (avoids racing first-boot package activity)
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2] # 2 = finished with recoverable warnings

- name: K3s server (control plane)
  hosts: k3s_server
  become: true
  roles:
    - k3s_server

- name: K3s agents (workers)
  hosts: k3s_agents
  become: true
  roles:
    - k3s_agent

- name: Verify the cluster and export a kubeconfig
  hosts: k3s_server
  become: true
  tasks:
    # Retry until every inventory host has registered AND is Ready
    # ("kubectl wait --all" would only wait for nodes that have already registered).
    - name: Wait until every inventory node is Ready, expected {{ groups['all'] | length }}
      ansible.builtin.command: k3s kubectl get nodes --no-headers
      register: nodes
      until: nodes.stdout_lines | select('search', '\sReady\s') | list | length == groups['all'] | length
      retries: 30
      delay: 10
      changed_when: false

    - name: Show the nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines

    - name: Read the admin kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_raw
      no_log: true

    - name: Write the kubeconfig locally (public API endpoint, context "skywatch-aws")
      ansible.builtin.copy:
        content: >-
          {{ kubeconfig_raw.content | b64decode
             | replace('https://127.0.0.1:6443', 'https://' ~ k3s_api_endpoint ~ ':6443')
             | replace(': default', ': skywatch-aws') }}
        dest: "{{ kubeconfig_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true # contains the cluster-admin client key

- name: GitOps bootstrap (Argo CD + SkyWatch Application)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Install Argo CD and register the Application (same script as the local cluster)
      ansible.builtin.command: "{{ playbook_dir }}/../scripts/bootstrap-argocd.sh"
      environment:
        # Read from the server host: the implicit localhost is not in the inventory groups.
        KUBECONFIG: "{{ hostvars[groups['k3s_server'][0]].kubeconfig_path }}"
        EXPECTED_CONTEXT: skywatch-aws # the script refuses any other cluster
      register: argocd_bootstrap
      # Reports what actually happened: the script skips Helm when chart and values are unchanged.
      changed_when: argocd_bootstrap.stdout is search('==> Installing|skywatch (created|configured)')

    - name: Show bootstrap result
      ansible.builtin.debug:
        msg: "{{ argocd_bootstrap.stdout_lines | select('match', '^(==>|skywatch:|application)') | list }}"
