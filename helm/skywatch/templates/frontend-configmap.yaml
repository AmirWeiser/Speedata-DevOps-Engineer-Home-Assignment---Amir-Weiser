apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "skywatch.labels" . | nindent 4 }}
    {{- include "skywatch.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
data:
  # Derived from the backend Service, so the URL and the Service name cannot drift apart.
  BACKEND_URL: {{ printf "http://%s-backend:%v" .Release.Name .Values.backend.port | quote }}
  {{- range $key, $value := .Values.frontend.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
