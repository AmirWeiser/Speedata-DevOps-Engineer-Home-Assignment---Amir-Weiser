apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "skywatch.labels" . | nindent 4 }}
    {{- include "skywatch.selectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below the desired replica count during a rollout
  selector:
    matchLabels:
      {{- include "skywatch.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skywatch.labels" . | nindent 8 }}
        {{- include "skywatch.selectorLabels" (dict "root" . "component" "frontend") | nindent 8 }}
      annotations:
        # Pods do not reread a changed ConfigMap; a new checksum triggers a rolling update.
        checksum/config: {{ include (print $.Template.BasePath "/frontend-configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false # the app never calls the Kubernetes API
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # One replica per worker node; same policy as the backend (ADR-008).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              {{- include "skywatch.selectorLabels" (dict "root" . "component" "frontend") | nindent 14 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ required "frontend.image.tag is required" .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-frontend
          # /healthz checks only this process, never the backend (ADR-004).
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              # Keep serving while the pod is removed from Service endpoints, then
              # gunicorn drains in-flight requests on SIGTERM.
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
